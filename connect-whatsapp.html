
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Your WhatsApp Number | XTOP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;color:#1c1e21;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{max-width:420px;width:calc(100% - 32px);background:#fff;border-radius:16px;padding:28px 24px;box-shadow:0 2px 12px #0001;text-align:center}
h1{font-size:23px;color:#16a34a;margin-bottom:12px}
p{font-size:15px;color:#65676b;line-height:1.6;margin-bottom:20px}
.btn{width:100%;padding:16px;border:0;border-radius:10px;font-size:16px;font-weight:bold;background:#25D366;color:white;cursor:pointer}
.btn:disabled{opacity:.6}
.hidden{display:none}
.error{background:#fef2f2;color:#b91c1c;padding:12px;border-radius:8px;margin-top:15px;font-size:14px}
.success{color:#15803d;margin-top:18px;line-height:1.7;font-size:15px}
</style>
</head>
<body>
<div class="box">
<h1>🟢 Connect Your WhatsApp</h1>
<p id="planInfo">Connect your WhatsApp Business account securely through Meta.</p>
<button class="btn" id="btnConnect" onclick="connectNow()">🔗 Connect My WhatsApp Number</button>
<div id="errorMsg" class="error hidden"></div>
<div id="successMsg" class="success hidden"></div>
</div>

<script async defer crossorigin="anonymous"
src="https://connect.facebook.net/en_US/sdk.js"></script>

<script>
const API="https://mldywarnnwjitfvqpgis.supabase.co/functions/v1/whatsapp-webhook?action=onboard";
const APP_ID="1947931015867084";
const CONFIG_ID="1470585484884368";

const params=new URLSearchParams(location.search);
const SESSION_TOKEN=params.get("token")||"";
const PLAN=(params.get("plan")||"STANDARD").toUpperCase();

let fbReady=false;
let authCode=null;
let signupInfo=null;
let submitting=false;
let cancelled=false;

const btn=document.getElementById("btnConnect");

window.fbAsyncInit=function(){
 try{
  FB.init({
   appId:APP_ID,
   cookie:true,
   xfbml:false,
   version:"v21.0"
  });
  fbReady=true;
 }catch(e){
  showError("Meta could not be initialized. Refresh and try again.");
 }
};

function showError(message){
 const el=document.getElementById("errorMsg");
 el.textContent=message;
 el.classList.remove("hidden");
}

function resetButton(){
 btn.disabled=false;
 btn.textContent="🔗 Connect My WhatsApp Number";
}

function validFacebookOrigin(origin){
 try{
  const u=new URL(origin);
  return u.protocol==="https:" &&
   (u.hostname==="facebook.com" ||
    u.hostname.endsWith(".facebook.com"));
 }catch(e){return false;}
}

window.addEventListener("message",function(event){
 if(!validFacebookOrigin(event.origin))return;

 let data=event.data;
 try{
  if(typeof data==="string")data=JSON.parse(data);
 }catch(e){return;}

 if(!data || data.type!=="WA_EMBEDDED_SIGNUP")return;

 if(data.event==="FINISH"){
  const d=data.data||{};
  signupInfo={
   waba_id:d.waba_id||"",
   phone_number_id:d.phone_number_id||""
  };
  tryFinish();
 }
 else if(data.event==="CANCEL"){
  cancelled=true;
  showError("You cancelled the WhatsApp connection. You can try again.");
  resetButton();
 }
 else if(data.event==="ERROR"){
  cancelled=true;
  showError("Meta reported an error during signup. Please try again.");
  resetButton();
 }
});

function connectNow(){
 document.getElementById("errorMsg").classList.add("hidden");

 if(!SESSION_TOKEN){
  showError("Your signup link is invalid. Request a new link through WhatsApp.");
  return;
 }

 if(!fbReady || typeof FB==="undefined"){
  showError("Meta is still loading. Wait a few seconds and try again.");
  return;
 }

 authCode=null;
 signupInfo=null;
 cancelled=false;

 btn.disabled=true;
 btn.textContent="Opening Meta...";

 try{
  FB.login(function(response){
   if(cancelled)return;

   if(response && response.authResponse && response.authResponse.code){
    authCode=response.authResponse.code;
    btn.textContent="Verifying your WhatsApp account...";
    tryFinish();
   }else{
    resetButton();
    showError("Authorization was not completed. Please try again.");
   }
  },{
   config_id:CONFIG_ID,
   auth_type:"rerequest",
   response_type:"code",
   override_default_response_type:true,
   extras:{}
  });
 }catch(error){
  resetButton();
  showError("Could not open Meta signup. Please refresh and try again.");
 }
}

async function tryFinish(){
 if(submitting || cancelled || !authCode || !signupInfo)return;

 if(!signupInfo.waba_id || !signupInfo.phone_number_id){
  showError("Meta did not return the WhatsApp account details. Please restart signup.");
  resetButton();
  return;
 }

 submitting=true;
 btn.disabled=true;
 btn.textContent="Activating your account...";

 try{
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),30000);

  const response=await fetch(API,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    session_token:SESSION_TOKEN,
    auth_code:authCode,
    package_code:PLAN,
    waba_id:signupInfo.waba_id,
    phone_number_id:signupInfo.phone_number_id
   }),
   signal:controller.signal
  });

  clearTimeout(timeout);

  const result=await response.json();

  if(!response.ok || !result.success){
   throw new Error(result.error||"Account activation failed.");
  }

  btn.classList.add("hidden");
  document.getElementById("planInfo").classList.add("hidden");

  const success=document.getElementById("successMsg");
  success.classList.remove("hidden");

  const heading=document.createElement("strong");
  heading.textContent="🎉 Your WhatsApp connection is complete!";

  const details=document.createElement("p");
  details.style.marginTop="12px";
  details.textContent=
   "Number: "+(result.phone||"Connected")+
   "\nPlan: "+(result.package||PLAN)+
   "\nTrial ends: "+(result.trial_ends?
    new Date(result.trial_ends).toLocaleDateString():"Activated");

  success.append(heading,details);

 }catch(error){
  showError(error.name==="AbortError"?
   "The request timed out. Please try again.":
   error.message||"Something went wrong.");
  resetButton();
 }finally{
  submitting=false;
 }
}

window.addEventListener("load",function(){
 if(!SESSION_TOKEN){
  showError("Your signup link is missing. Request a new link.");
 }
 document.getElementById("planInfo").textContent=
  "You selected the "+PLAN+" plan. Connect your WhatsApp Business account securely through Meta.";
});
</script>
</body>
</html>
