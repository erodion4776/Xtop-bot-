<rect x="34" y="150" width="300" height="66" rx="17" fill="#fff"/><text x="52" y="178" font-family="Arial,sans-serif" font-size="16" fill="#34493c">Welcome! 👋</text><text x="52" y="199" font-family="Arial,sans-serif" font-size="14" fill="#65766b">What are you looking for today?</text>
