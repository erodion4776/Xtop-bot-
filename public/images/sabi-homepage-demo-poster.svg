<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Sabi by XTOP WhatsApp shopping demo</title><desc id="desc">A green and cream illustration showing a Sabi Store WhatsApp conversation, product catalogue and confirmed order.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8ee"/><stop offset="1" stop-color="#dcebd8"/></linearGradient><linearGradient id="phone" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#174b35"/><stop offset="1" stop-color="#0d3024"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#143b2b" flood-opacity=".18"/></filter></defs>
<rect width="1280" height="720" fill="url(#bg)"/><circle cx="120" cy="80" r="170" fill="#d5e9c9" opacity=".6"/><circle cx="1130" cy="660" r="260" fill="#c8e2bf" opacity=".6"/>
<g transform="translate(86 108)"><text x="0" y="0" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#176b4b">SABI BY XTOP</text><text x="0" y="105" font-family="Arial,sans-serif" font-size="66" font-weight="800" fill="#173b2b">Your shop.</text><text x="0" y="180" font-family="Arial,sans-serif" font-size="66" font-weight="800" fill="#39844d">On WhatsApp.</text><text x="0" y="236" font-family="Arial,sans-serif" font-size="24" fill="#526b5a">See how customers browse, ask</text><text x="0" y="272" font-family="Arial,sans-serif" font-size="24" fill="#526b5a">questions and place an order.</text>
