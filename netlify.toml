# Netlify Configuration File
# Configures Netlify to only deploy the static onboarding frontend web page,
# completely bypassing Supabase Edge Functions, Deno runtime, and Android/Gradle builds.

[build]
  # No build command needed — pure static HTML/CSS/JS
  command = ""
  
  # Directory to serve (uses root directory where index.html is located)
  publish = "."

# Ensure mobile browsers receive clean security headers and no stale caching
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Optional redirect rule: ensures query parameters and URL reloads resolve cleanly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
