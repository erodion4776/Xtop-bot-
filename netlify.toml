[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/data-deletion"
  to = "/data-deletion.html"
  status = 200

[[redirects]]
  from = "/share/:kind/:id"
  to = "https://mldywarnnwjitfvqpgis.supabase.co/functions/v1/sabi-share-preview?kind=:kind&id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://mldywarnnwjitfvqpgis.supabase.co/functions/v1/sabi-marketplace-seo"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap-:page.xml"
  to = "https://mldywarnnwjitfvqpgis.supabase.co/functions/v1/sabi-marketplace-seo?page=:page"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
