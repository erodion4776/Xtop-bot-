<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Connect Your WhatsApp Number</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#1c1e21;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{max-width:400px;width:100%;margin:16px;background:#fff;border-radius:16px;padding:28px 24px;box-shadow:0 2px 8px rgba(0,0,0,0.08);text-align:center}
h1{font-size:22px;color:#25D366;margin-bottom:8px}
p{font-size:15px;color:#65676b;line-height:1.5;margin-bottom:20px}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;background:#25D366;color:#fff;text-decoration:none}
.btn:active{background:#1ea952}
.btn:disabled{background:#a8dfc1;cursor:not-allowed}
.success{color:#25D366;font-size:18px;font-weight:700;margin-top:16px;line-height:1.5}
.error{color:#b91c1c;background:#fef2f2;border-radius:8px;padding:12px;margin-top:14px;font-size:14px}
.loading{display:inline-block;width:18px;height:18px;border:2.5px solid #fff;border-radius:50%;border-top-color:transparent;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none}
</style>
</head>
<body>
<div class="box">
  <h1>&#128994; Connect Your Number</h1>
  <p id="planInfo">Tap below to verify your WhatsApp Business number with Meta. This takes about 2 minutes.</p>

  <button class="btn" id="btnConnect" onclick="connectNow()">
    &#128279; Connect My WhatsApp Number
  </button>

  <div class="error hidden" id="errorMsg"></div>
  <div class="success hidden" id="successMsg"></div>
</div>

<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>

<script>
var API = "https://mldywarnnwjitfvqpgis.supabase.co/functions/v1/whatsapp-webhook?action=onboard";
var APP_ID = "1947931015867084";
var CONFIG_ID = "1470585484884368";
var REDIRECT_URI = "https://xtopbot.netlify.app/";
var params = new URLSearchParams(window.location.search);
var TOKEN = params.get('token') || params.get('state') || '';
var PLAN = params.get('plan') || 'STANDARD';
var fbReady = false;

window.fbAsyncInit = function() {
  try { FB.init({ appId: APP_ID, cookie: true, xfbml: false, version: 'v21.0' }); fbReady = true; } catch(e) {}
};

window.addEventListener('message', function(e) {
  if (e.origin !== "https://www.facebook.com" && e.origin !== "https://web.facebook.com") return;
  try {
    var d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
    if (d && d.type === 'WA_EMBEDDED_SIGNUP' && d.event === 'FINISH') {
      if (d.data) {
        sessionStorage.setItem('waba', d.data.waba_id || '');
        sessionStorage.setItem('phone', d.data.phone_number_id || '');
      }
    }
  } catch(err) {}
});

function connectNow() {
  if (!TOKEN) { showError("Your link has expired. Go back to WhatsApp and request a new one."); return; }
  var btn = document.getElementById('btnConnect');
  btn.innerHTML = '<span class="loading"></span> Opening Meta...';
  btn.disabled = true;

  if (typeof FB !== 'undefined' && fbReady) {
    try {
      FB.login(function(r) {
        if (r.authResponse && (r.authResponse.code || r.authResponse.accessToken)) {
          finishSetup(r.authResponse.code || r.authResponse.accessToken);
        } else {
          btn.innerHTML = '&#128279; Connect My WhatsApp Number';
          btn.disabled = false;
        }
      }, {
        config_id: CONFIG_ID,
        response_type: 'code',
        override_default_response_type: true,
        extras: { feature: 'whatsapp_embedded_signup', version: 2, sessionInfoVersion: 2 }
      });
      return;
    } catch(e) {}
  }

  window.location.assign(
    'https://www.facebook.com/v21.0/dialog/oauth?client_id=' + APP_ID +
    '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
    '&config_id=' + CONFIG_ID +
    '&response_type=code&state=' + encodeURIComponent(TOKEN)
  );
}

async function finishSetup(code) {
  var btn = document.getElementById('btnConnect');
  btn.innerHTML = '<span class="loading"></span> Activating your bot...';
  var ctrl = new AbortController();
  var timer = setTimeout(function() { ctrl.abort(); }, 25000);

  try {
    var resp = await fetch(API, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        session_token: TOKEN,
        auth_code: code,
        package_code: PLAN,
        redirect_uri: REDIRECT_URI,
        waba_id: sessionStorage.getItem('waba') || '',
        phone_number_id: sessionStorage.getItem('phone') || ''
      }),
      signal: ctrl.signal
    });
    clearTimeout(timer);
    var data = await resp.json();
    if (!data.success) throw new Error(data.error || 'Setup failed');

    document.getElementById('btnConnect').classList.add('hidden');
    document.getElementById('planInfo').classList.add('hidden');
    var msg = document.getElementById('successMsg');
    msg.classList.remove('hidden');
    msg.innerHTML = '&#127881; Your bot is live!<br><br>' +
      'Number: <strong>' + (data.phone || 'Connected') + '</strong><br>' +
      'Plan: <strong>' + data.package + '</strong><br>' +
      'Free trial ends: <strong>' + new Date(data.trial_ends).toLocaleDateString() + '</strong><br><br>' +
      'Go back to WhatsApp and send "hi" to your new number!';
  } catch(err) {
    clearTimeout(timer);
    showError(err.name === 'AbortError' ? 'Timed out. Please try again.' : (err.message || 'Something went wrong.'));
    btn.innerHTML = '&#128279; Connect My WhatsApp Number';
    btn.disabled = false;
  }
}

function showError(m) { var e = document.getElementById('errorMsg'); e.textContent = m; e.classList.remove('hidden'); }

window.addEventListener('load', function() {
  var err = params.get('error_description') || params.get('error');
  if (err) { showError("Login cancelled. Please try again."); return; }
  var code = params.get('code');
  if (code) finishSetup(code);
  if (PLAN) document.getElementById('planInfo').textContent = 'You selected the ' + PLAN + ' plan. Tap below to verify your WhatsApp number.';
});
</script>
</body>
</html>
