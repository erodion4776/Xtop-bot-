
name: Deploy to Production

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for Supabase CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Supabase CLI from npm
        run: npm install --no-save --no-package-lock supabase@3.0.0

      - name: Link project
        run: npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy WhatsApp webhook
        run: |
          npx --no-install supabase functions deploy whatsapp-webhook \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt

      - name: Deploy wallet API
        run: |
          if [ -d "supabase/functions/wallet-api" ]; then
            npx --no-install supabase functions deploy wallet-api \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --no-verify-jwt
          fi

      - name: Deploy order API
        run: |
          npx --no-install supabase functions deploy order-api \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt

      - name: Deploy merchant Paystack API
        run: |
          npx --no-install supabase functions deploy merchant-paystack \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt

      - name: Deploy merchant registration
        run: |
          npx --no-install supabase functions deploy merchant-register \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Sabi dashboard API
        run: |
          npx --no-install supabase functions deploy xtop-dashboard \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deployment Summary
        run: |
          echo "WhatsApp webhook preserved."
          echo "Wallet API deployment checked."
          echo "Order API deployment checked."
          echo "Merchant Paystack API deployment configured."
          echo "Merchant registration deployment checked."
          echo "Sabi dashboard API deployment configured."

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy-functions

    steps:
      - name: Check Webhook Status
        run: |
          WEBHOOK_URL="https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/whatsapp-webhook"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$WEBHOOK_URL" || true)
          echo "Webhook response status: $HTTP_STATUS"
          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "WhatsApp Webhook: $WEBHOOK_URL" >> $GITHUB_STEP_SUMMARY
          echo "Merchant Paystack API deployment configured." >> $GITHUB_STEP_SUMMARY
          echo "Order API deployment configured." >> $GITHUB_STEP_SUMMARY
          echo "Merchant registration deployment configured." >> $GITHUB_STEP_SUMMARY
          echo "Sabi dashboard API deployment configured." >> $GITHUB_STEP_SUMMARY
