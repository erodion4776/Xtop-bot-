
name: Deploy to Production

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.226.4
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy whatsapp-webhook
        run: |
          echo "Deploying existing WhatsApp webhook..."
          supabase functions deploy whatsapp-webhook \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt

      - name: Deploy wallet-api
        run: |
          if [ -d "supabase/functions/wallet-api" ]; then
            echo "Deploying merchant wallet API..."
            supabase functions deploy wallet-api \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --no-verify-jwt
          else
            echo "wallet-api directory not created yet. Skipping."
          fi

      - name: Deployment Summary
        run: |
          echo "Both deployment targets checked."
          echo "WhatsApp webhook preserved."

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy-functions

    steps:
      - name: Check Webhook Status
        run: |
          WEBHOOK_URL="https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/whatsapp-webhook"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$WEBHOOK_URL" || true)

          echo "Webhook response status: $HTTP_STATUS"

          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "WhatsApp Webhook: $WEBHOOK_URL" >> $GITHUB_STEP_SUMMARY
          echo "Wallet API deployment target configured." >> $GITHUB_STEP_SUMMARY
