name: ENGR ERO CBT Auto-submit (manual fallback)

# The production Supabase pg_cron job is the authoritative auto-submit scheduler.
# This workflow is retained only as an operator-triggered fallback.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-expired-exams:
    name: Manually submit expired web CBT attempts
    runs-on: ubuntu-latest
    steps:
      - name: Submit expired attempts
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          ENGR_ERO_CRON_SECRET: ${{ secrets.ENGR_ERO_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$ENGR_ERO_CRON_SECRET" ]; then
            echo "::error::Manual fallback requires SUPABASE_PROJECT_ID and ENGR_ERO_CRON_SECRET GitHub secrets. Production auto-submit continues through Supabase pg_cron."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/engr-ero-portal" \
            --header "Content-Type: application/json" \
            --header "x-portal-cron-secret: ${ENGR_ERO_CRON_SECRET}" \
            --data '{"action":"sweep_expired_exams"}'
