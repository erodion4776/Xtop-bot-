# .github/workflows/deploy-staging.yml
#
# Deploys to a STAGING Supabase project for testing.
# Triggers on push to the develop branch.

name: Deploy to Staging

on:
  push:
    branches:
      - develop
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID

      - name: Push migrations to staging
        run: |
          echo "🚀 Pushing migrations to staging..."
          supabase db push --password ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

      - name: Deploy Edge Functions to staging
        run: |
          echo "🚀 Deploying functions to staging..."
          supabase functions deploy whatsapp-webhook \
            --project-ref $SUPABASE_PROJECT_ID \
            --no-verify-jwt

      - name: Set staging secrets
        run: |
          supabase secrets set \
            WHATSAPP_ACCESS_TOKEN=${{ secrets.STAGING_WHATSAPP_ACCESS_TOKEN }} \
            WHATSAPP_PHONE_NUMBER_ID=${{ secrets.STAGING_WHATSAPP_PHONE_NUMBER_ID }} \
            WHATSAPP_VERIFY_TOKEN=${{ secrets.STAGING_WHATSAPP_VERIFY_TOKEN }} \
            AI_API_KEY=${{ secrets.AI_API_KEY }} \
            AI_MODEL=${{ secrets.AI_MODEL || 'gpt-4o-mini' }} \
            --project-ref $SUPABASE_PROJECT_ID

      - name: Staging summary
        run: |
          echo "## 🧪 Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Webhook URL:** \`https://${{ secrets.SUPABASE_STAGING_PROJECT_ID }}.supabase.co/functions/v1/whatsapp-webhook\`" >> $GITHUB_STEP_SUMMARY
