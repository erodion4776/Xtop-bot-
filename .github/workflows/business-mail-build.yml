name: XTOP Business Mail build

on:
  push:
    branches: [main]
    paths:
      - "business-mail/**"
      - ".github/workflows/business-mail-build.yml"
  pull_request:
    paths:
      - "business-mail/**"
      - ".github/workflows/business-mail-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-mail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: business-mail/package.json
      - run: npm install
      - run: npm run build
