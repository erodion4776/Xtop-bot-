name: Build Android Admin App

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          cache-disabled: false

      - name: Build Debug APK with Gradle
        working-directory: android
        env:
          # Default Supabase project URL
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://mldywarnnwjitfvqpgis.supabase.co' }}
          # In GitHub repo Settings -> Secrets and variables -> Actions, ensure SUPABASE_ANON_KEY is set.
          # If not set, it defaults to a clear placeholder string that the app detects and prompts in Settings.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'SUPABASE_ANON_KEY_PLACEHOLDER' }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XtopAdmin-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build Summary
        run: |
          echo "## 📱 Android Build Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Debug APK is ready for download!**" >> $GITHUB_STEP_SUMMARY
          echo "If the app reports an invalid key upon launch, enter your project anon key in the in-app Settings (gear icon)." >> $GITHUB_STEP_SUMMARY
