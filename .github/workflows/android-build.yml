name: Build Android Admin App

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          cache-disabled: true # Prevents GitHub cache service 400/500 network crashes

      - name: Build Debug APK with Gradle
        working-directory: android
        env:
          # Default Supabase project URL
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://mldywarnnwjitfvqpgis.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'SUPABASE_ANON_KEY_PLACEHOLDER' }}
          # Increase network download timeouts to prevent broken downloads
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dhttp.keepAlive=false -Dorg.gradle.jvmargs=-Xmx2048m"
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XtopAdmin-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build Summary
        if: always()
        run: |
          echo "## 📱 Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Debug APK workflow completed!**" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifact zip file above to get the **app-debug.apk**." >> $GITHUB_STEP_SUMMARY
