name: Build Android Admin App

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Debug APK
        working-directory: android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://mldywarnnwjitfvqpgis.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XtopAdmin-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Summary
        run: |
          echo "## 📱 Android Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Debug APK built successfully!**" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifact **XtopAdmin-Debug-APK** from the summary page to install on your Android device." >> $GITHUB_STEP_SUMMARY
